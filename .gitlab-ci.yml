before_script:
  - export DISTRO_CODENAME=`lsb_release -cs` && echo Using distro $DISTRO_CODENAME

variables:
  GET_SOURCES_ATTEMPTS: "3"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: "recursive"

#########################
# Templates using anchors
#########################
.armhf_focal_t: &armhf_focal_job
  image: registry.roboception.de/tools/docker_images:armhf-focal-buildimage
  tags:
    - armhf
    - docker

.amd64_jammy_t: &amd64_jammy_job
  image: registry.roboception.de/tools/docker_images:jammy-buildimage
  tags:
    - amd64
    - docker

.arm64_jammy_t: &arm64_jammy_job
  image: registry.roboception.de/tools/docker_images:jammy-buildimage
  tags:
    - arm64
    - docker

.armhf_jammy_t: &armhf_jammy_job
  image: registry.roboception.de/tools/docker_images:armhf-jammy-buildimage
  tags:
    - armhf
    - docker

.amd64_noble_t: &amd64_noble_job
  image: registry.roboception.de/tools/docker_images:noble-buildimage
  tags:
    - amd64
    - docker

.arm64_noble_t: &arm64_noble_job
  image: registry.roboception.de/tools/docker_images:noble-buildimage
  tags:
    - arm64
    - docker

.armhf_noble_t: &armhf_noble_job
  image: registry.roboception.de/tools/docker_images:armhf-noble-buildimage
  tags:
    - armhf
    - docker

#############
# Templates
#############
.test:
  stage: test
  variables:
    CMAKE_OPTS: ""
  script:
    - echo -e "\e[0Ksection_start:`date +%s`:build\r\e[0KBuild"
    - mkdir build && cd build
    - cmake $CMAKE_OPTS ..
    - make -j 4
    - echo -e "\e[0Ksection_end:`date +%s`:build\r\e[0K"
    - echo -e "\e[0Ksection_start:`date +%s`:test\r\e[0KTest"
    - CTEST_OUTPUT_ON_FAILURE=1 make test
    - echo -e "\e[0Ksection_end:`date +%s`:test\r\e[0K"

# Debian packaging
.package:
  stage: deploy
  variables:
    CMAKE_OPTS: ""
  script:
    - echo -e "\e[0Ksection_start:`date +%s`:build\r\e[0KBuild"
    - mkdir build && cd build
    - cmake $CMAKE_OPTS ..
    - make -j 4
    - make package
    - echo -e "\e[0Ksection_end:`date +%s`:build\r\e[0K"
    - echo -e "\e[0Ksection_start:`date +%s`:upload\r\e[0KUpload debian package"
    - if [ -z "$APT_REPO" ]; then export APT_REPO=testing; fi
    - upload_deb.sh $DISTRO_CODENAME-$APT_REPO *.deb
    - echo -e "\e[0Ksection_end:`date +%s`:upload\r\e[0K"

.package_testing:
  extends: .package
  only:
    - master
  except:
    - tags
  variables:
    APT_REPO: "testing"

.package_stable:
  extends: .package
  only:
    - /^v[0-9]+\.[0-9]+\.[0-9]+/
  except:
    - branches
  variables:
    APT_REPO: "stable"

##############
#### Jobs ####
##############
gen_dox:
  <<: *amd64_jammy_job
  stage: deploy
  script:
    - apt-get update -yq && apt-get install -y doxygen ncftp
    - mkdir build && cd build
    - cmake ..
    - make doc
    - upload_dox.sh doc/html
  only:
    - master
    - tags
  tags:
    - docs

################
# Testing builds
################

# Test against (on every commit)
################################
test:focal:armhf:
  <<: *armhf_focal_job
  extends: .test
  variables:
    CMAKE_OPTS: "-DUSE_GDAL=off"

test:jammy:amd64:
  <<: *amd64_jammy_job
  extends: .test

test:jammy:arm64:
  <<: *arm64_jammy_job
  extends: .test

test:jammy:armhf:
  <<: *armhf_jammy_job
  extends: .test

test:noble:amd64:
  <<: *amd64_noble_job
  extends: .test

test:noble:arm64:
  <<: *arm64_noble_job
  extends: .test

test:noble:armhf:
  <<: *armhf_noble_job
  extends: .test

# Deploy testing (only on master)
#################################
package_testing:focal:armhf:
  <<: *armhf_focal_job
  extends: .package_testing
  variables:
    CMAKE_OPTS: "-DUSE_GDAL=off"

package_testing:jammy:amd64:
  <<: *amd64_jammy_job
  extends: .package_testing

package_testing:jammy:arm64:
  <<: *arm64_jammy_job
  extends: .package_testing

package_testing:jammy:armhf:
  <<: *armhf_jammy_job
  extends: .package_testing

package_testing:noble:amd64:
  <<: *amd64_noble_job
  extends: .package_testing

package_testing:noble:arm64:
  <<: *arm64_noble_job
  extends: .package_testing

package_testing:noble:armhf:
  <<: *armhf_noble_job
  extends: .package_testing

################
# Stable builds
################

# Deploy stable (only for releases, version tags)
#################################################
package_stable:focal:armhf:
  <<: *armhf_focal_job
  extends: .package_stable
  variables:
    CMAKE_OPTS: "-DUSE_GDAL=off"

package_stable:jammy:amd64:
  <<: *amd64_jammy_job
  extends: .package_stable

package_stable:jammy:arm64:
  <<: *arm64_jammy_job
  extends: .package_stable

package_stable:jammy:armhf:
  <<: *armhf_jammy_job
  extends: .package_stable

package_stable:noble:amd64:
  <<: *amd64_noble_job
  extends: .package_stable

package_stable:noble:arm64:
  <<: *arm64_noble_job
  extends: .package_stable

package_stable:noble:armhf:
  <<: *armhf_noble_job
  extends: .package_stable
